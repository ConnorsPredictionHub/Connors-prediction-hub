<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Bets | Connor's Prediction Hub</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#143a59,transparent 45%),#08111e;color:#ecf5ff;font:15px/1.6 Inter,system-ui,Arial,sans-serif;min-height:100vh}a{color:#8ad7ff;text-decoration:none}a:hover{color:#fff}header{background:#0c1b2c;border-bottom:1px solid #2c4660;padding:20px max(22px,calc((100vw - 1260px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.03em;font-size:19px}.brand span{color:#55c5fa}nav{display:flex;gap:10px;flex-wrap:wrap}nav a{border:1px solid #355575;border-radius:10px;padding:9px 14px;font-size:13px;background:#142c44}main{max-width:1260px;margin:38px auto 80px;padding:0 22px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#7fcff9;font-weight:800;text-transform:uppercase}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.045em;margin:5px 0}h2{font-size:18px;margin:0}p{color:#9fb5cb;margin:5px 0}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}.refresh{background:#183b56;border:1px solid #4d7594;color:#e5f5ff;padding:11px 18px;border-radius:11px;font-weight:750;cursor:pointer}.refresh:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-bottom:28px}.stat,.panel,.bet{background:linear-gradient(155deg,#13273e,#0e1c2e);border:1px solid #2e4b66;border-radius:16px}.stat{padding:22px}.stat small{color:#9fb5cb}.stat strong{display:block;font-size:27px;line-height:1.3;margin-top:8px}.panel{padding:25px;margin-bottom:25px}.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}.toolbar label{font-weight:650;font-size:13px}.toolbar select{background:#0d1d30;border:1px solid #45627e;border-radius:9px;color:#fff;padding:10px 13px;font:inherit;min-width:170px}.count{margin-left:auto;color:#9fb5cb;font-size:13px}.bets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.bet{padding:23px;min-width:0;overflow-wrap:anywhere}.bet-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.sport{font-size:12px;font-weight:800;letter-spacing:.08em;color:#7bd1ff}.pill{border:1px solid #6e603c;background:#302b1d;color:#f5d68a;padding:4px 10px;border-radius:30px;font-size:11px;font-weight:800}.legs{margin:0;padding-left:20px;color:#f0f5ff}.legs li{margin:9px 0;line-height:1.55}.bet-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px;border-top:1px solid #30445a;padding-top:16px}.bet-meta small{display:block;color:#94abc1;font-size:11px}.bet-meta strong{display:block;font-size:15px}.notes{margin-top:16px;padding:11px 13px;background:#0b1b2c;border-radius:9px;font-size:13px}.empty{padding:60px 20px;text-align:center;color:#afc3d6}.message{margin-bottom:18px;font-size:13px;color:#a4bcd1}.bottom{margin-top:24px;text-align:center;font-size:13px}@media(max-width:760px){.bets{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:15px}.stat strong{font-size:21px}.panel{padding:16px}.bet{padding:18px}.count{margin-left:0}main{padding:0 15px;margin-top:25px}}@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}

/* Match Prediction Hub charcoal / warm gold branding */
body{background:radial-gradient(ellipse at 80% -15%,#30271b 0,transparent 43%),#0d1218;color:#f3eee4}
a{color:#e9bf72}a:hover{color:#ffe3a7}
header{background:#10161e;border-bottom:1px solid #6d5431}
.brand{color:#f1eee6}.brand span{color:#e7ba61}
nav a{background:#211d18;border-color:#8b6b3b;color:#efd49d}
nav a:hover{background:#35291b;color:#ffe3a7}
.eyebrow{color:#e1b768}
h1,h2{color:#f4eee2}
p,.count,.message{color:#bcb5a6}
.refresh{background:linear-gradient(135deg,#f5d88c,#c9963d);border-color:#b58a47;color:#18140e}
.refresh:hover{background:#ffe4a5}
.stat,.panel,.bet{background:linear-gradient(145deg,#171f29,#101720);border-color:#57482e;box-shadow:0 10px 28px #0004}
.stat small,.bet-meta small{color:#b8ae9e}
.stat strong,.bet-meta strong{color:#f5e4bf}
.toolbar select{background:#0e1720;border-color:#695536;color:#f3eee4}
.sport{color:#e7bd6b}
.pill{border-color:#a57b3e;background:#3b2c18;color:#f7d68d}
.legs{color:#f3eee4}
.bet-meta{border-top-color:#57482e}
.notes{background:#1c211f;color:#d8cbb4}
.empty{color:#bcb5a6}
:focus-visible{outline:2px solid #f0c76c;outline-offset:3px}
</style></head><body>
<header><a class="brand" href="./index.html">CONNORS <span>PREDICTION HUB</span></a><nav><a href="./index.html">← Dashboard</a><a href="./bet-tracker.html">Full Bet Tracker ↗</a></nav></header>
<main><div class="hero"><div><div class="eyebrow">Betting dashboard</div><h1>Open Bets</h1><p>All your unsettled singles and multis in one place.</p></div><button type="button" class="refresh" id="reload">↻ Refresh Open Bets</button></div>
<div id="status" class="message" role="status">Checking your account…</div>
<section id="app" hidden><div class="stats"><div class="stat"><small>Pending bets</small><strong id="total">0</strong></div><div class="stat"><small>Recorded stakes</small><strong id="staked">—</strong></div><div class="stat"><small>Potential gross returns</small><strong id="potential">—</strong></div></div>
<div class="panel"><div class="toolbar"><h2>Pending selections</h2><label for="sportFilter">Sport</label><select id="sportFilter"><option value="all">All sports</option><option value="nhl">NHL</option><option value="nfl">NFL</option><option value="mlb">MLB</option><option value="nbl">NBL</option><option value="horse">Horse Racing</option><option value="greyhounds">Greyhounds</option></select><span id="visibleCount" class="count"></span></div><div id="bets" class="bets"></div></div>
<p class="bottom">To mark a bet Won, Lost or Void, use the <a href="./bet-tracker.html">Full Bet Tracker ↗</a>.</p></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://uvqbvqhkztdmdiayycuz.supabase.co','sb_publishable_8ORcSlzgRyosS3U8_N8SmQ_lj5TT4OS');
const $=id=>document.getElementById(id);
let userId,records=[];
const money=n=>'AUD $'+Number(n).toFixed(2);
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
function render(){
 const filter=$('sportFilter').value;
 const filtered=records.filter(b=>filter==='all'||b.sport===filter);
 const root=$('bets');root.replaceChildren();
 $('total').textContent=records.length;
 const withStake=records.filter(b=>b.stake!==null&&Number.isFinite(Number(b.stake)));
 const withReturn=records.filter(b=>b.stake!==null&&b.decimal_odds!==null&&Number.isFinite(Number(b.stake)*Number(b.decimal_odds)));
 $('staked').textContent=withStake.length?money(withStake.reduce((s,b)=>s+Number(b.stake),0)):'—';
 $('potential').textContent=withReturn.length?money(withReturn.reduce((s,b)=>s+Number(b.stake)*Number(b.decimal_odds),0)):'—';
 $('visibleCount').textContent=filtered.length+' open bet'+(filtered.length===1?'':'s');
 if(!filtered.length){const empty=el('div',records.length?'No open bets for this sport.':'No pending bets right now.');empty.className='empty';root.append(empty);return;}
 for(const b of filtered){
  const card=el('article');card.className='bet';
  const head=el('div');head.className='bet-head';const sport=el('span',String(b.sport||'').toUpperCase()+' · '+String(b.bet_type||'').toUpperCase());sport.className='sport';const pill=el('span','PENDING');pill.className='pill';head.append(sport,pill);card.append(head);
  const legs=el('ol');legs.className='legs';for(const leg of b.legs||[])legs.append(el('li',leg));card.append(legs);
  const meta=el('div');meta.className='bet-meta';
  for(const [label,value] of [['Stake',b.stake===null?'Not entered':money(b.stake)],['Accepted odds',b.decimal_odds===null?'Not entered':Number(b.decimal_odds).toFixed(2)],['Placed',new Date(b.placed_at).toLocaleDateString('en-AU')]]){const cell=el('div');cell.append(el('small',label),el('strong',value));meta.append(cell);}
  card.append(meta);
  if(b.notes){const note=el('p',b.notes);note.className='notes';card.append(note);}
  root.append(card);
 }
}
async function load(){
 $('reload').disabled=true;$('status').textContent='Loading your pending bets…';
 try{
  const {data,error}=await db.from('bet_tracker').select('*').eq('user_id',userId).eq('status','pending').order('placed_at',{ascending:false}).limit(500);
  if(error)throw error;
  records=data||[];render();$('status').textContent='Showing your open bets only. Nothing here changes or settles a bet.';
 }catch(e){$('status').textContent='Could not load open bets: '+e.message;}
 finally{$('reload').disabled=false;}
}
async function start(){
 try{
  const {data:{session}}=await db.auth.getSession();
  if(!session?.user){$('status').textContent='Sign in on the main Prediction Hub first.';return;}
  userId=session.user.id;
  const {data:profile,error}=await db.from('profiles').select('approved').eq('id',userId).single();
  if(error||!profile?.approved){$('status').textContent='Approved account required.';return;}
  $('app').hidden=false;await load();
 }catch(e){$('status').textContent='Connection error: '+e.message;}
}
$('sportFilter').addEventListener('change',render);
$('reload').addEventListener('click',load);
start();
</script></body></html>
